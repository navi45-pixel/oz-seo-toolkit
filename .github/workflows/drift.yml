name: Drift check (deployed worker vs repo)

# The deployed worker must always behave like the code in this repo.
# This job diffs the live workers.dev site against repo-side expectations
# (scripts/check-drift.js): security headers and cache policy from
# lib/security-headers.js, the HTTP→HTTPS 301, page/canonical/og:url tags,
# robots.txt rules, sitemap <loc>/<lastmod>, and the /api/health contract.
#
# It catches: a stale or failed deploy, a Cloudflare dashboard setting
# changed by hand, a public file edited without redeploying, or any code
# change that reached the edge without passing CI.
#
# The deploy origin is derived from public/sitemap.xml (the same canonical
# origin the pages use), so there is exactly one place to update when the
# domain changes. Optional override: DRIFT_BASE_URL repo variable.

on:
  schedule:
    # 22:05 UTC daily — outside the sync-kv (14:05 UTC) and CI windows.
    - cron: "5 22 * * *"
  workflow_dispatch: {}

concurrency:
  group: drift-${{ github.ref }}
  cancel-in-progress: false

jobs:
  drift:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    name: Live worker vs repo
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # check-drift.js itself is dependency-free, but deriving the origin
      # reads public/sitemap.xml; install is cheap and keeps future needs safe.
      - name: Install dependencies
        run: npm ci

      - name: Drift check (deployed worker vs repo)
        run: npm run check:drift

      - name: Open an issue on drift
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = 'Drift detected: deployed worker differs from repo';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              'The scheduled drift check found the deployed worker behaving differently from the repo.',
              '',
              `Run: ${runUrl}`,
              '',
              'Likely causes: a stale or failed deploy, a Cloudflare dashboard setting changed by hand,',
              'or a public file edited without redeploying. Fix: `npm run deploy`, or revert the change.',
            ].join('\n');
            const existing = await github.rest.issues.listForRepo({
              ...context.repo, state: 'open', per_page: 100,
            });
            const dup = existing.data.find((i) => i.title === title);
            if (dup) {
              await github.rest.issues.createComment({ ...context.repo, issue_number: dup.number, body });
            } else {
              await github.rest.issues.create({ ...context.repo, title, body, labels: ['drift', 'bug'] });
            }
