name: CI OzSEO Toolkit

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    name: Launcher + API smoke test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Keep README claims (check count, Skills Hub module breakdown) in sync
      # with the code — fails the build when either side drifts.
      - name: README-vs-code consistency check
        run: npm run check:readme

      # The real launcher: heals deps if wiped, neutralizes a bad PORT env,
      # takes over a busy port, and blocks until /api/health answers.
      - name: Start via launcher (start.sh)
        run: bash start.sh

      # Shared smoke tests (the same script verifies a Workers deploy in
      # deploy.sh): /api/health, a real audit, and every page.
      - name: Smoke test (health, audit, pages)
        run: node scripts/smoke.js http://localhost:3000

      - name: Stop server
        if: always()
        run: npm stop

      # Bundle-check the Workers entry so a format/import regression fails CI
      # here instead of breaking the Cloudflare deploy workflow.
      - name: Wrangler dry-run build (Workers bundle check)
        run: npx -y wrangler deploy --dry-run --outdir=dist

      - name: Upload server log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: server-log
          path: server.log
          if-no-files-found: ignore
