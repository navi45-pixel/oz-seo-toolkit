name: Deploy OzSEO Toolkit to Cloudflare Workers

# Manual trigger only: push-triggered deploys are handled by Cloudflare
# Workers Builds (Cloudflare's Git integration, which clones this repo
# directly). This workflow remains as an alternative path — before running
# it, set the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repo secrets
# (gh secret set CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID).
on:
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to Cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
