name: Sync backlink directory (Node store <-> Workers KV)

# Keeps data/backlinks.json and the Workers KV directory converged:
# daily pull-merge (adopts submissions made on the edge), then a verified
# push so both stores hold the identical union.
#
# The merged store (which contains submitter emails) is intentionally NOT
# committed to this public repo — it is kept as a run artifact (private to
# the repo) and re-uploaded to KV from here. The live Worker holds the
# authoritative copy between runs.
#
# Required secret: CLOUDFLARE_API_TOKEN (a token with Workers KV edit
# permission). Without it the job exits early instead of failing red.
# Optional secret: ADMIN_TOKEN — only used for a post-sync reachability
# probe of the moderation endpoint.

on:
  schedule:
    - cron: '17 21 * * *' # daily 21:17 UTC (~7:17am AEST) — off peak
  workflow_dispatch: {}

concurrency:
  group: sync-kv
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Skip when no Cloudflare token is configured
        if: ${{ secrets.CLOUDFLARE_API_TOKEN == '' }}
        run: |
          echo "CLOUDFLARE_API_TOKEN is not set — KV sync is not configured."
          echo "Add it as a repo secret (token needs Workers KV edit permission) to enable this workflow."
          exit 0

      - name: Checkout
        if: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
        uses: actions/checkout@v4

      - name: Setup Node
        if: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies (wrangler)
        if: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
        run: npm ci

      # Pull-merge: union of the (possibly missing, gitignored) local file and
      # the KV directory. Nothing is lost from either side; emails are only
      # ever written to the private artifact + KV, never to the repo.
      - name: Pull-merge KV into the Node store
        if: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/sync-kv.js --pull

      # Verified push: converge KV to the same union and assert both sides.
      - name: Push the merged store back to KV (verified)
        if: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/sync-kv.js

      - name: Verify final state matches
        if: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/sync-kv.js --check

      - name: Job summary
        if: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && always() }}
        run: |
          {
            echo "## KV sync result"
            if [ -f data/backlinks.json ]; then
              echo "- listings in merged store: $(node -e "console.log(require('./data/backlinks.json').length)")"
            else
              echo "- merged store: not written (sync failed?)"
            fi
            echo "- runs daily at 21:17 UTC; merged data is kept as a private run artifact, never committed"
          } >> "$GITHUB_STEP_SUMMARY"

      # Offsite backup of the merged store (contains emails — artifact is
      # private to the repo, retained 90 days). Ensures a copy survives even
      # if the KV namespace were ever lost.
      - name: Upload merged store artifact
        if: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: backlinks-merged
          path: data/backlinks.json
          retention-days: 90
          if-no-files-found: error
